<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a241c">
  <title>Centre Street 叫货清单</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <section id="login-view" class="login-panel" aria-labelledby="login-title" hidden>
      <p class="eyebrow">Centre Street · 内部工具</p>
      <h1 id="login-title">进入叫货清单</h1>
      <p>输入店内的 4 位密码。</p>
      <form id="login-form">
        <label for="pin">4 位密码</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required>
        <button type="submit">登录</button>
      </form>
    </section>

    <section id="app-view" hidden>
      <header class="app-header">
        <div><p class="eyebrow">内部叫货记录</p><h1>叫货清单</h1></div>
        <button id="add-item" type="button">＋ 添加货品</button>
      </header>

      <nav class="toolbar" aria-label="货品状态筛选">
        <div class="filters">
          <button type="button" data-filter="active" aria-pressed="true">使用中</button>
          <button type="button" data-filter="archived" aria-pressed="false">已归档</button>
          <button type="button" data-filter="all" aria-pressed="false">全部</button>
        </div>
        <div class="toolbar-links">
          <a href="/api/export.csv" download>导出 CSV</a>
          <button id="logout" class="link-button" type="button">退出</button>
        </div>
      </nav>

      <section id="item-list" aria-label="货品"></section>
    </section>
  </main>

  <dialog id="item-editor" aria-labelledby="editor-title">
    <form id="item-form">
      <div class="dialog-heading">
        <div><p class="eyebrow">货品资料</p><h2 id="editor-title">添加货品</h2></div>
        <button class="icon-button" type="button" data-close="item-editor" aria-label="关闭">×</button>
      </div>
      <input id="item-id" type="hidden">
      <label for="item-name">货品名称</label>
      <input id="item-name" maxlength="120" required>
      <label for="manual-interval">手动周期（天）</label>
      <input id="manual-interval" type="number" inputmode="numeric" min="1" max="365" placeholder="留空则自动学习">
      <label for="item-notes">备注</label>
      <textarea id="item-notes" maxlength="500" rows="3"></textarea>
      <label class="check-row" for="item-active">
        <input id="item-active" type="checkbox" checked>
        使用中（取消勾选会归档）
      </label>
      <div class="dialog-actions">
        <button type="button" class="secondary" data-close="item-editor">取消</button>
        <button type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="history-dialog" aria-labelledby="history-title">
    <div class="dialog-heading">
      <div><p class="eyebrow">叫货记录</p><h2 id="history-title">历史</h2></div>
      <button class="icon-button" type="button" data-close="history-dialog" aria-label="关闭">×</button>
    </div>
    <div id="history-list"></div>
  </dialog>

  <aside id="undo-bar" class="undo-bar" hidden>
    <span id="undo-message"></span>
    <button id="undo-order" type="button">撤销</button>
  </aside>
  <p id="status" class="sr-status" role="status" aria-live="polite"></p>

  <script type="module" src="/app.js"></script>
</body>
</html>
