name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static SEO, bilingual content and tracking
        run: |
          node scripts/check-seo.mjs
          node scripts/check-bilingual-site.mjs
          node scripts/check-attribution.mjs
          node scripts/build-dining-assistant.mjs --check
          node scripts/build-dining-helper-pages.mjs --check
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow about updated pages
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
